talks:
  - title: "On separable functors"
    speaker: "Valdis Laan"
    duration: "50 min"
    affiliation: tartu
    abstract: |
      Separable functors were introduced in 1989 by Nastasescu, Van den Bergh and Van Oystaeyen. Every full and faithful functor is separable and every separable functor is faithful. Later, heavily separable and semiseparable functors have been defined. In our talk, we consider some general properties of separable functors and then speak about separability properties of the restriction of scalars and extension of scalars functors between the categories of firm acts over firm semigroups. 
  - title: "On the univalence of (∞,ω)-categories"
    speaker: "Miika Tuominen"
    duration: "50 min"
    affiliation: 
    abstract: |
      While developing a model of homotopy-theoretic categories, Rezk identified a completeness condition that sets their theory from that of ordinary categories and ties homotopical and categorical equivalences together. Rezk’s completeness condition was later reinterpreted by Voevodsky as the univalence axiom which is foundational in the type-theoretic approach to category theory. A particularly important characterization of univalence is that it is precisely the condition that makes essentially surjective fully faithful functors invertible. In this talk, we discuss univalence of higher-dimensional categories and the conditions on functors that characterize it.  
  - title: "Enriched presheaves as graded functors"
    speaker: "Callum Reader"
    duration: "25 min"
    affiliation: taltech
    abstract: |
      The enriched category of presheaves on a V-category, C, for V a complete closed symmetric monoidal category, is exhibited by the functor V-category [C°, V]. In contrast, for a category C enriched in a bicategory W, there is no apparent way to express the W-category of presheaves on C as a functor category.

      We show that, by generalising from categories enriched in a bicategory, to categories graded by a bicategory, the W-category of presheaves may be realised, after all, as a functor category construction. This clarifies the nature of presheaf constructions for categories enriched in bicategories. To get to this result we develop some bicategory-graded category theory which illuminates some surprising relationships, including a mutual generalisation of actegories and Grothendieck fibrations.
  - title: "Sequential dynamical systems and the categories they form"
    speaker: "Fosco Loregian"
    duration: "25 min"
    affiliation: taltech
    abstract: |
      Introduced by Mortveit and Reidys in the 1990's, *sequential dynamical systems* (SDS) use the topology of a graph $G$ to apply update rules in the order prescribed by a finite word in the alphabet $G_0$ of vertices of $G$. We study a category $\mathbf{SDS}_\chi$ of such SDS (whose maps are built on the analogue of finite-fibre coverings in topology) which is opfibered over the category Gph of digraphs via a functor $\Gamma : {\bf SDS} \to {\bf Gph}$. We also construct fully faithful adjoints to the functor extracting the dynamics of an SDS, and we investigate whether initial and terminal objects, or finite products, exist in $\mathbf{SDS}_\chi$; we define a limit-preserving functor yielding cycle-set invariant, in the spirit of what topological dynamics uses to classify such systems.

      There is a certain interest in studying the analogue of an SDS, so far interpreted in a Cartesian category, in a *semi*cartesian setting; for example, in a Markov category. This theory of "stochastic" SDS bears some evident but elusive relation to some classical facts of statistical mechanics (most notably, the Ising model). A stochastic SDS consists of a rule to keep part $K$ of a system $S$ fixed, and redraw the remaining part according to a conditional probability distribution on the complement of $K$. Statistical mechanics studies these assignments under the name "Gibbs kernels".
